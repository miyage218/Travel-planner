name: Hafta sonu bilet taraması

on:
  schedule:
    - cron: "17 4,16 * * *"   # Günde 2 kez (07:17 ve 19:17 TSİ)
  workflow_dispatch:

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      # Fiyat geçmişi (normal fiyat hesabı) ve gönderilmiş bildirimler çalıştırmalar arasında korunur
      - uses: actions/cache/restore@v4
        with:
          path: data/history.db
          key: history-${{ github.run_id }}
          restore-keys: history-

      - name: Tara
        run: travel-planner -c config.example.toml scan
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data/history.db
          key: history-${{ github.run_id }}
